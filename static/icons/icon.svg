<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6DAE94"/>
      <stop offset="100%" stop-color="#528272"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4956E"/>
      <stop offset="100%" stop-color="#C07D5A"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Subtle inner shadow -->
  <rect width="512" height="512" rx="108" ry="108" fill="none" stroke="#4A7A66" stroke-width="2" opacity="0.3"/>

  <!-- Pie chart base circle (budget visualization) -->
  <circle cx="256" cy="240" r="130" fill="#FDFBF8" opacity="0.95"/>

  <!-- Pie segment 1 - large sage portion -->
  <path d="M256,240 L256,110 A130,130 0 0,1 376,190 Z" fill="#639A88" opacity="0.85"/>

  <!-- Pie segment 2 - terracotta portion -->
  <path d="M256,240 L376,190 A130,130 0 0,1 330,355 Z" fill="#C07D5A" opacity="0.85"/>

  <!-- Pie segment 3 - sand portion -->
  <path d="M256,240 L330,355 A130,130 0 0,1 182,355 Z" fill="#E2DCD2" opacity="0.85"/>

  <!-- Pie segment 4 - coffee portion -->
  <path d="M256,240 L182,355 A130,130 0 0,1 136,190 Z" fill="#2D2520" opacity="0.5"/>

  <!-- Pie segment 5 - light sage remainder -->
  <path d="M256,240 L136,190 A130,130 0 0,1 256,110 Z" fill="#9CC4B2" opacity="0.85"/>

  <!-- Center circle -->
  <circle cx="256" cy="240" r="52" fill="#FDFBF8"/>
  <circle cx="256" cy="240" r="48" fill="url(#bg)"/>

  <!-- Dollar sign in center -->
  <text x="256" y="256" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="52" fill="#FDFBF8">$</text>

  <!-- Bottom bar chart elements -->
  <rect x="152" y="400" width="36" height="52" rx="6" fill="#FDFBF8" opacity="0.8"/>
  <rect x="202" y="384" width="36" height="68" rx="6" fill="#FDFBF8" opacity="0.9"/>
  <rect x="252" y="368" width="36" height="84" rx="6" fill="#FDFBF8"/>
  <rect x="302" y="388" width="36" height="64" rx="6" fill="#FDFBF8" opacity="0.85"/>
  <rect x="352" y="396" width="36" height="56" rx="6" fill="#C07D5A" opacity="0.9"/>
</svg>
